<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Río-Panajachel</title>
<meta name="description" content="Información de la congregación El Río-Panajachel">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El Río">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../styles.css">
</head>
<body class="app-pub">
<header class="top">
  <div class="top-in">
    <div class="row" style="gap:12px;flex-wrap:nowrap"><div>
      <div class="brand" id="brand">El Río-Panajachel</div>
      <div class="sub">Información de la congregación</div>
    </div></div>
    <div class="row" style="gap:8px;flex-wrap:nowrap">
      <button id="btnInstalar" class="btn-ghost-light" hidden onclick="instalarApp()">Instalar app</button>
      <button id="btnAvisos" class="btn-campana" hidden onclick="Avisos.boton()" aria-label="Avisos al teléfono"></button>
      <button id="btnPerfil" class="btn-campana" onclick="abrirPerfil()" aria-label="Mi perfil y ajustes"></button>
    </div>
  </div>
</header>
<div id="demoBanner" class="demo" hidden>Sin conectar a Google · lo publicado solo se ve en este teléfono</div>

<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<main id="app" class="wrap" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div></main>

<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="viewer-bar">
    <button onclick="cerrarVisor()" aria-label="Cerrar">✕ Cerrar</button>
    <div class="t" id="viewerTitle"></div>
    <a id="viewerOpen" target="_blank" rel="noopener">Abrir original</a>
  </div>
  <div class="viewer-hint">Toque la imagen para acercar · deslice para moverse</div>
  <div class="viewer-body" id="viewerBody"></div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script defer src="../config.js"></script>
<script defer src="../core.js"></script>
<script defer src="../mapa.js"></script>
<script defer src="../programa.js"></script>
<script defer src="../tablas.js"></script>
<script defer src="../docs.js"></script>
<script defer src="../publicadores.js"></script>
</body>
</html>
