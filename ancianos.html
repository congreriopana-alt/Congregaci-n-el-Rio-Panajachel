<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ancianos · El Río-Panajachel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#13263f">
<link rel="manifest" href="manifest-ancianos.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ancianos">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top admin-top">
  <div class="top-in">
    <div>
      <div class="brand">Panel de ancianos</div>
      <div class="sub" id="subBrand">El Río-Panajachel</div>
    </div>
    <div class="row">
      <button id="btnInstalar" class="btn-ghost-light" hidden onclick="instalarApp()">Instalar</button>
      <button id="btnSalir" class="btn-ghost-light" hidden onclick="salir()">Salir</button>
    </div>
  </div>
</header>
<div id="demoBanner" class="demo" hidden>Modo demostración · contraseña de prueba: <b>rio2026</b></div>
<nav class="admin-tabs" id="tabs" hidden aria-label="Secciones del panel"></nav>
<main id="app" class="wrap admin"></main>

<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="viewer-bar">
    <button onclick="cerrarVisor()" aria-label="Cerrar">✕ Cerrar</button>
    <div class="t" id="viewerTitle"></div>
    <a id="viewerOpen" target="_blank" rel="noopener">Abrir original</a>
  </div>
  <div class="viewer-hint">Toque la imagen para acercar</div>
  <div class="viewer-body" id="viewerBody"></div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="ancianos.js"></script>
</body>
</html>
